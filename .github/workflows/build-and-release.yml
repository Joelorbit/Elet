name: Fast Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. PARALLEL VALIDATION JOB (Fast Lint & Tests)
  # ==========================================
  validate:
    name: 🧪 Validate & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔍 Parallel TypeCheck & Tests
        run: |
          npx tsc --noEmit &
          PID_TSC=$!
          npm test &
          PID_TEST=$!
          wait $PID_TSC
          wait $PID_TEST

  # ==========================================
  # 2. OPTIMIZED ANDROID BUILD JOB (With Gradle & Hermes Cache)
  # ==========================================
  build-android:
    name: 🤖 Fast Android Release Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔨 Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: ⚡ Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🤖 Compile Small Release APK (~30MB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --parallel --build-cache --max-workers=4

      - name: 📦 Prepare Release APK (~30 MB)
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching in build/outputs/apk/..."
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found release APK at: $APK_PATH"
          cp "$APK_PATH" ./release-artifacts/Elet-Release.apk
          ls -la ./release-artifacts

      - name: 🏷️ Determine Release Version
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")"
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload Single Small APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "Elet ${{ steps.release-tag.outputs.tag }} (Single Small APK ~30MB)"
          body: |
            ## 🕊️ Elet • ዕለት v1.3.0 — Ethiopian Orthodox Spiritual Companion

            ### ✝️ What's New in v1.3.0:

            **ምስጢረ ንስሐ • Confession Sanctuary (Complete User CRUD & Biometric Protection)**
            - **የንስሐ ማስታወሻዎች (Confession Notes CRUD)**: Full Create, Read, Update, and Delete for private confession reflection notes, detailed sins to confess, and questions/counsel for your spiritual father.
            - **የንስሐ ነጥቦች (Custom Examination Ticks CRUD)**: User-driven custom examination points — add custom sins or faults, edit text inline, delete items, and check them off.
            - **የቤተክርስቲያን መመርመሪያዎች (Orthodox Examination Library)**: Quick import from Ethiopian Orthodox spiritual examination prompts directly into your personal custom checklist.
            - **ቀኖናና ስግደት (Penance & Prostrations CRUD)**: Track canonical prostrations and prayer rules assigned by your confessor with inline title/count editing.
            - **የጣት አሻራ ጥበቃ (Biometric Encryption)**: The entire Confession sanctuary is locked with biometric authentication (fingerprint / Face ID / passcode) with instant one-tap re-locking.

            **የደወልና ማሳወቂያ ሥርዓት • Alarm Overdraw & Heads-Up Display Fixes**
            - **Overdraw & Heads-Up Alerting**: Added Android MAX priority, heads-up channel routing, and alarm audio attributes so alarms reliably pop up over other open apps and wake device screens.
            - **Deep Link & Notification Response Catch**: Seamlessly captures alarm launches from background or killed state via `getLastNotificationResponseAsync` and opens the liturgical fullscreen alarm immediately.
            - **Translucent Status Bar**: Fullscreen alarm modal now renders with `statusBarTranslucent` and hardware acceleration for uninterrupted full-screen canonical bells.
            - **Interactive Alarm Diagnostics**: Dynamic runtime permission checks in Settings with guided one-tap navigation to system overlay, exact alarm, and battery exemption settings.

            **🏛️ Codebase Quality & Stability**
            - 100% strict TypeScript typing (`npx tsc --noEmit` clean with 0 errors).
            - All 334+ liturgical Bahire Hasab tests passing.
            - Strict zero-mock blank slate store state.
            - 100% offline-first, private and secure on-device storage.

            ### ⚡ Performance:
            - **Single Lightweight APK**: ~30 MB (arm64-v8a)
            - **R8 ProGuard Shrinking**: Tree-shaken unused native code & resources
            - **100% Offline**: Zero cloud dependence

            ### 📱 Download:
            Download **`Elet-Release.apk`** (~30 MB) below.
          files: |
            ./release-artifacts/Elet-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
