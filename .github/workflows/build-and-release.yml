name: Elet Android 2.0 Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (must match package.json, e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Validate the exact package/config version and run checks sequentially so
  # a failing typecheck or test cannot be hidden by a successful background job.
  # ==========================================
  validate:
    name: 🧪 Validate & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.13.1 (Expo SDK 57 minimum)
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --include=dev --prefer-offline

      - name: 🏷️ Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const expo = require('./app.json').expo;
          const expected = `v${pkg.version}`;
          if (expo.version !== pkg.version) throw new Error(`app.json (${expo.version}) must match package.json (${pkg.version})`);
          if (process.env.RELEASE_TAG !== expected) throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`);
          console.log(`Validated ${expected}`);
          NODE

      - name: 🔍 TypeScript validation
        run: npx tsc --noEmit

      - name: 🧪 Unit suite
        run: npm test

  # ==========================================
  # 2. OPTIMIZED ANDROID BUILD JOB (With Gradle & Hermes Cache)
  # ==========================================
  build-android:
    name: 🤖 Fast Android Release Build
    needs: validate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 🟢 Setup Node.js 22.13.1 (Expo SDK 57 minimum)
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: "npm"

      - name: 📥 Install Dependencies
        # NODE_ENV=production is set for this job, but postinstall requires the
        # dev dependency patch-package. Explicitly include dev deps for install.
        run: npm ci --include=dev --prefer-offline

      - name: 🔨 Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: ⚡ Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🤖 Build arm64 and ARMv7 APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --parallel --build-cache --max-workers=4

      - name: 📦 Build Play App Bundle
        working-directory: android
        run: ./gradlew bundleRelease -Pandroid.bundle=true -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --parallel --build-cache --max-workers=4

      - name: 📦 Prepare architecture APKs and AAB
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          ARM64_APK=$(find android/app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -print -quit)
          ARMV7_APK=$(find android/app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release/ -name "*.aab" -print -quit)
          test -n "$ARM64_APK" || { echo "arm64-v8a APK missing"; exit 1; }
          test -n "$ARMV7_APK" || { echo "armeabi-v7a APK missing"; exit 1; }
          test -n "$AAB" || { echo "Android App Bundle missing"; exit 1; }
          cp "$ARM64_APK" ./release-artifacts/Elet-Release.apk
          cp "$ARMV7_APK" ./release-artifacts/Elet-Release-armeabi-v7a.apk
          cp "$AAB" ./release-artifacts/Elet-Release.aab
          ls -la ./release-artifacts

      - name: 🏷️ Determine Release Version
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")"
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload Android Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "Elet ${{ steps.release-tag.outputs.tag }} (Android APKs and App Bundle)"
          body: |
            ## Elet • ዕለት ${{ steps.release-tag.outputs.tag }} — Ethiopian Orthodox Spiritual Companion

            ### What's new

            - Android alarm channel reliability, notification icon, exact-alarm diagnostics, and biometric device-credential fallback.
            - Android home-screen quick widget for Prayer, Calendar, and Scripture.
            - Separate arm64-v8a and armeabi-v7a APKs, plus an Android App Bundle for Play distribution.

            This release targets Android 8.0 (API 26) and newer. Full-screen alarm presentation remains subject to Android permission and device-state rules.

            ### Downloads
            - `Elet-Release.apk`: arm64-v8a phones and tablets.
            - `Elet-Release-armeabi-v7a.apk`: 32-bit ARM devices.
            - `Elet-Release.aab`: Google Play upload.
          files: |
            ./release-artifacts/Elet-Release.apk
            ./release-artifacts/Elet-Release-armeabi-v7a.apk
            ./release-artifacts/Elet-Release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
