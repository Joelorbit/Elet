name: Fast Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. PARALLEL VALIDATION JOB (Fast Lint & Tests)
  # ==========================================
  validate:
    name: 🧪 Validate & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔍 Parallel TypeCheck & Tests
        run: |
          npx tsc --noEmit &
          PID_TSC=$!
          npm test &
          PID_TEST=$!
          wait $PID_TSC
          wait $PID_TEST

  # ==========================================
  # 2. OPTIMIZED ANDROID BUILD JOB (With Gradle & Hermes Cache)
  # ==========================================
  build-android:
    name: 🤖 Fast Android Release Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: ⚡ Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔨 Compile Optimized Small Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache --max-workers=4

      - name: 📦 Prepare Release APK (~30 MB)
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching in build/outputs/apk/..."
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found release APK at: $APK_PATH"
          cp "$APK_PATH" ./release-artifacts/Elet-Release.apk
          ls -la ./release-artifacts

      - name: 🏷️ Determine Release Version
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")"
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload Single Small APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "Elet ${{ steps.release-tag.outputs.tag }} (Single Small APK ~30MB)"
          body: |
            ## 🕊️ Elet • ዕለት — Ethiopian Orthodox Spiritual Companion
            *Version: `${{ steps.release-tag.outputs.tag }}`*

            ### ⚡ Performance & Size Improvements:
            - **Single Lightweight APK**: Reduced from 109 MB down to **~30 MB** (arm64-v8a target).
            - **R8 ProGuard Shrinking**: Tree-shaken unused native bytecode and resources.
            - **100% Offline-First**: Zero cloud tracking, instant local database.

            ### 📱 Download & Install:
            Download **`Elet-Release.apk`** (~30 MB) to install directly on your Android phone.
          files: |
            ./release-artifacts/Elet-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
