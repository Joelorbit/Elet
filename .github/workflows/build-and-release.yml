name: Fast Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. PARALLEL VALIDATION JOB (Fast Lint & Tests)
  # ==========================================
  validate:
    name: 🧪 Validate & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔍 Parallel TypeCheck & Tests
        run: |
          npx tsc --noEmit &
          PID_TSC=$!
          npm test &
          PID_TEST=$!
          wait $PID_TSC
          wait $PID_TEST

  # ==========================================
  # 2. OPTIMIZED ANDROID BUILD JOB (With Gradle & Hermes Cache)
  # ==========================================
  build-android:
    name: 🤖 Fast Android Release Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci --prefer-offline

      - name: 🔨 Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: ⚡ Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🤖 Compile Small Release APK (~30MB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --parallel --build-cache --max-workers=4

      - name: 📦 Prepare Release APK (~30 MB)
        id: prepare-artifacts
        run: |
          mkdir -p ./release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching in build/outputs/apk/..."
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found release APK at: $APK_PATH"
          cp "$APK_PATH" ./release-artifacts/Elet-Release.apk
          ls -la ./release-artifacts

      - name: 🏷️ Determine Release Version
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")"
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload Single Small APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "Elet ${{ steps.release-tag.outputs.tag }} (Single Small APK ~30MB)"
          body: |
            ## 🕊️ Elet • ዕለት ${{ steps.release-tag.outputs.tag }} — Ethiopian Orthodox Spiritual Companion

            ### ✝️ What's New in ${{ steps.release-tag.outputs.tag }}:

            **🔔 የሙሉ ገጽ ደወል ሥርዓት • Android Native Full-Screen Intent Alarm**
            - **Native Alarm Clock Engine**: Integrated Android `AlarmManager.setAlarmClock()` and a high-priority `BroadcastReceiver` that awakens devices from sleep, bypasses Doze mode, and displays the liturgical alarm directly over other running apps and the lock screen.
            - **Native Sound Resource**: Bundled the sacred cathedral bell chime (`alarm_bell.wav`) into Android raw resources with dedicated `USAGE_ALARM` audio routing.
            - **Expo Config Plugin Architecture**: Created `withAndroidAlarmOverlay` plugin to guarantee 100% reproducible native prebuilds in CI and local environments.
            - **Automatic Liturgical Sync**: Canonical prayer routines (ሰዓታት) and fasting break times (የጾም መፍቻ) set to `full_alarm` automatically schedule exact native full-screen alarms.

            **⏰ የ5 ደቂቃ ማዘግያ • 5-Minute Alarm Snooze**
            - **Snooze Option**: Added an intuitive "Snooze 5 min" (ከ5 ደቂቃ በኋላ) button directly on the full-screen liturgical alarm modal with solemn haptic feedback and automatic rescheduling.
            - **Font Rendering Fix**: Removed conflicting native `fontWeight` styles to guarantee dignified typography without Android fallback to Roboto.

            **🔤 የጽሑፍ መጠን ማስተካከያ • Dynamic Typography Scaling**
            - **Large Text Mode**: Fully wired the `textScale` setting so selecting "Large" dynamically scales all app typography by 1.15x for enhanced readability.

            **🔍 የስርዓት ፈቃድ ፍተሻ • Android 14+ Diagnostics**
            - **Runtime Permissions**: Added dynamic checking for `canUseFullScreenIntent()` on Android 14+ (API 34+) devices with a direct one-tap shortcut to system settings.
            - **Dynamic Versioning**: Settings badge now dynamically displays the active release tag.

            **🏛️ Codebase Quality & Stability**
            - 100% clean TypeScript validation (`npx tsc --noEmit` with 0 errors).
            - All 334/334 Bahire Hasab calendar & liturgical tests passing.
            - 100% offline-first, private and secure on-device storage.

            ### ⚡ Performance:
            - **Single Lightweight APK**: ~30 MB (arm64-v8a)
            - **R8 ProGuard Shrinking**: Tree-shaken native code & resources
            - **100% Offline**: Zero cloud dependence

            ### 📱 Download:
            Download **`Elet-Release.apk`** (~30 MB) below.
          files: |
            ./release-artifacts/Elet-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
