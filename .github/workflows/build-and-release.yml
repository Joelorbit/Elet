name: Build & Publish Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  validate-and-build:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Validation
        run: npx tsc --noEmit

      - name: 🧪 Run Automated Tests
        run: npx jest --passWithNoTests || npm test --if-present

      - name: 🚀 Setup Expo CLI & EAS
        run: npm install -g eas-cli expo-cli

      - name: 🔨 Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🤖 Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Locate APK Artifact
        id: find-apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated in release folder, checking standard build outputs..."
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./Elet-Release.apk
          echo "apk_path=./Elet-Release.apk" >> $GITHUB_OUTPUT

      - name: 🏷️ Determine Release Version
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "Elet ${{ steps.release-tag.outputs.tag }} (Release APK)"
          body: |
            ## 🌟 Elet • ዕለት — Ethiopian Orthodox Spiritual Companion
            
            ### 📱 What's New in this Release:
            - **81-Canon Scriptures**: Complete canonical reader with offline search & chapter picker.
            - **24-Year Bahire Hasab (2018–2041)**: Movable fasts/feasts & 30 tabot saint alerts.
            - **Custom Fasting Engine**: Track personal vows & spiritual father penance fasts.
            - **Biometric Security**: Hardware FaceID / Fingerprint lock & confession encryption.
            - **Spiritual Insight Graph**: Interactive 7-Day bar charts, 30-Day grids & 52-Week matrix.
            - **100% Offline-First**: Zero tracking, zero cloud dependency.
            
            ### 📥 Download & Install:
            Download **`Elet-Release.apk`** below to install directly on your Android phone.
          files: |
            ./Elet-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
